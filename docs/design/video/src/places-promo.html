<!doctype html>
<!--
  Places launch film (15 s, 1920×1080). Every frame is a pure function of time: seek(t) poses all
  components. Nothing is a screenshot — the screens are rebuilt from the same tokens and parts as
  mockups 11–15 (docs/design/mockups/src/places.html) so each element can move on its own.
  Preview a frame: open with ?t=7.5 · render: node render.js (see docs/design/video/README.md)
  Scenes: 0 intro · 1 browse the map · 2 create (picker → form) · 3 leave / arrive notifications · 4 outro
-->
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Inter; font-weight: 400; src: url(../../../../assets/fonts/Inter-Regular.ttf); }
@font-face { font-family: Inter; font-weight: 500; src: url(../../../../assets/fonts/Inter-Medium.ttf); }
@font-face { font-family: Inter; font-weight: 600; src: url(../../../../assets/fonts/Inter-SemiBold.ttf); }
@font-face { font-family: Inter; font-weight: 700; src: url(../../../../assets/fonts/Inter-Bold.ttf); }
@font-face { font-family: Ph; src: url(../../../../assets/fonts/Phosphor-Regular.ttf); }
@font-face { font-family: PhF; src: url(../../../../assets/fonts/Phosphor-Fill.ttf); }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #06080F; }
body { font-family: Inter; -webkit-font-smoothing: antialiased; letter-spacing: -0.2px; color: #fff; }
.L { position: absolute; left: 0; top: 0; }
#stage { position: absolute; inset: 0; overflow: hidden; }

/* ---------- app tokens (design-direction.md §3), same as the mockups ---------- */
.app {
  --bg: #F2F2F7; --surface: #FFFFFF; --text: #000; --text2: rgba(60,60,67,.6);
  --sep: rgba(60,60,67,.18); --accent: #007AFF; --fill: rgba(118,118,128,.12);
  --seg-on: #FFFFFF; --shadow: 0 2px 10px rgba(0,0,0,.12);
  --blue:#007AFF; --indigo:#5856D6; --teal:#30B0C7; --green:#34C759; --orange:#FF9500;
  --pink:#FF2D55; --red:#FF3B30; --grey:#8E8E93;
  color: var(--text); letter-spacing: -0.2px;
}
.app.dark {
  --bg: #000; --surface: #1C1C1E; --text: #FFF; --text2: rgba(235,235,245,.6);
  --sep: rgba(84,84,88,.6); --accent: #0A84FF; --fill: rgba(118,118,128,.24);
  --blue:#0A84FF; --teal:#40C8E0; --green:#30D158; --orange:#FF9F0A;
}
.i { font-family: Ph; font-style: normal; line-height: 1; display: inline-block; }
.f { font-family: PhF; font-style: normal; line-height: 1; display: inline-block; }
.abs { position: absolute; }
.map { position: absolute; left: 0; right: 0; top: 0; overflow: hidden; }
.ring { position: absolute; border-radius: 50%; transform: translate(-50%,-50%); }
.pin { position: absolute; width: 36px; height: 36px; border-radius: 50%; transform: translate(-50%,-50%);

       border: 2.5px solid #fff; box-shadow: 0 3px 8px rgba(0,0,0,.25); }
.pin.big { width: 46px; height: 46px; font-size: 24px; }
.pin .count { position: absolute; top: -8px; right: -9px; min-width: 19px; height: 19px; border-radius: 10px;

.pin .live { position: absolute; bottom: -3px; right: -3px; width: 12px; height: 12px; border-radius: 50%;

.chips { display: flex; gap: 8px; }
.chip { height: 36px; border-radius: 18px; background: var(--surface); padding: 0 14px; display: flex; align-items: center; gap: 7px;

.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

.grab { width: 36px; height: 5px; border-radius: 3px; background: rgba(120,120,128,.35); margin: 7px auto 0; }

.group { background: var(--surface); border-radius: 12px; margin: 0 16px; overflow: hidden; position: relative; }
.row { display: flex; align-items: center; min-height: 54px; padding: 0 16px; gap: 12px; position: relative; }

.grow { flex: 1; min-width: 0; }
.t17 { font: 400 17px/22px Inter; }
.t17b { font: 600 17px/22px Inter; }
.t15 { font: 400 15px/20px Inter; color: var(--text2); }
.t13 { font: 400 13px/18px Inter; color: var(--text2); }
.ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.val { font: 400 17px Inter; color: var(--text2); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.val .i { font-size: 15px; opacity: .55; }
.switch { width: 51px; height: 31px; border-radius: 16px; background: rgba(118,118,128,.16); position: relative; flex: none; }
.knob { position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); }
.seg { display: flex; background: var(--fill); border-radius: 10px; padding: 2px; height: 36px; position: relative; }

.seg .on { font-weight: 600; }
.seg > .seghi, .seghi { position: absolute; flex: none; top: 2px; bottom: 2px; border-radius: 8px; background: var(--seg-on); box-shadow: 0 2px 6px rgba(0,0,0,.12); }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: #34C759; display: inline-block; flex: none; }
.fab { position: absolute; right: 25px; bottom: 32px; width: 60px; height: 60px; border-radius: 30px; background: var(--accent);
      color: #fff; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 8px 20px rgba(0,122,255,.35); }
.btn { height: 54px; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; font: 600 19px Inter; }

/* ---------- phone ---------- */
#phone { width: 414px; height: 868px; border-radius: 60px; background: #1D1D1F;

#screen { position: relative; width: 390px; height: 844px; border-radius: 48px; overflow: hidden; background: #000; isolation: isolate; }

/* ---------- film type ---------- */
.cap { position: absolute; }
.eb { font: 600 26px Inter; letter-spacing: -.3px; color: #007AFF; }
.hl { font: 600 80px/1.06 Inter; letter-spacing: -2.2px; color: #1D1D1F; margin-top: 14px; }
.hl .ln { display: block; white-space: nowrap; }
.sub { font: 400 28px/1.38 Inter; color: #6E6E73; margin-top: 24px; max-width: 560px; letter-spacing: -.4px; }
.fl { position: absolute; left: 0; top: 0; }
.flc { background: #fff; color: #000; border-radius: 18px; padding: 12px 16px; display: flex; align-items: center; gap: 12px;
       box-shadow: 0 0 0 1px rgba(0,0,0,.04), 0 10px 30px rgba(0,0,0,.08); white-space: nowrap; }
.fr { position: absolute; left: 0; top: 0; border-radius: 50%; }

/* world (scene 3) */
.wring { position: absolute; border-radius: 50%; }
.wpin { position: absolute; width: 58px; height: 58px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
        color: #fff; font-size: 30px; border: 3.5px solid #fff; box-shadow: 0 3px 8px rgba(0,0,0,.25); }
.wlab { position: absolute; font: 600 19px Inter; color: #1D1D1F; background: #fff; letter-spacing: -.2px;
        padding: 7px 14px; border-radius: 14px; white-space: nowrap; box-shadow: 0 0 0 1px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.08); }
.ev { position: absolute; display: flex; align-items: center; gap: 10px; font: 700 21px Inter; color: #fff; padding: 11px 18px 11px 12px;
      border-radius: 18px; white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,.14); }
.ev .evi { width: 34px; height: 34px; border-radius: 11px; background: rgba(255,255,255,.22); display: flex; align-items: center; justify-content: center; font-size: 20px; }

/* lock screen + notifications (mockup 05) */
.nt { position: absolute; left: 12px; right: 12px; top: 0; border-radius: 26px; background: rgba(44,44,48,.94); overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.nth { display: flex; align-items: center; gap: 9px; padding: 14px 16px 0; font: 400 14px Inter; color: rgba(235,235,245,.6); }
.nta { width: 22px; height: 22px; border-radius: 6px; background: #F5A300; color: #000; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.ntb { display: flex; align-items: center; gap: 13px; padding: 11px 16px 0; }
.ntt { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex: none; }
.ntbtn { display: flex; gap: 8px; padding: 13px 14px 14px; }
.ntbtn div { flex: 1; height: 40px; border-radius: 14px; background: rgba(120,120,128,.32); display: flex; align-items: center; justify-content: center;
             font: 600 15px Inter; color: #fff; white-space: nowrap; }
.dg { display: inline-block; height: 118px; overflow: hidden; }
.dgc div { height: 118px; line-height: 118px; text-align: center; }

</head>
<body>
<div id="stage"></div>
<script>
/* ================= helpers ================= */
const $ = (id) => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, u) => a + (b - a) * u;
const E = {
  lin: (t) => t,
  inQuad: (t) => t * t,
  inCubic: (t) => t * t * t,
  outCubic: (t) => 1 - Math.pow(1 - t, 3),
  outQuart: (t) => 1 - Math.pow(1 - t, 4),
  inOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
  inOutCubic: (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  inOutQuint: (t) => (t < .5 ? 16 * t ** 5 : 1 - Math.pow(-2 * t + 2, 5) / 2),
  outExpo: (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t)),
  inExpo: (t) => (t <= 0 ? 0 : Math.pow(2, 10 * t - 10)),
  inOutExpo: (t) => (t <= 0 ? 0 : t >= 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2),
  outBack: (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  outBackS: (t) => { const c1 = 2.6, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
};
/** progress of t through [a, b], eased */
const p = (t, a, b, e = E.lin) => e(clamp((t - a) / (b - a)));
/** damped spring 0 → 1 (seconds since start) */
const spr = (dt, f = 1.55, d = 6.5) => (dt <= 0 ? 0 : 1 - Math.exp(-d * dt) * Math.cos(2 * Math.PI * f * dt));
/** keyframe track: [[t, value(number|array), easeIntoThisKey?], ...] */
function track(t, keys, def = E.inOutCubic) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [t1, v1, e] = keys[i]; const [t0, v0] = keys[i - 1];
    if (t <= t1) {
      const u = (e || def)((t - t0) / (t1 - t0));
      return Array.isArray(v0) ? v0.map((a, j) => a + (v1[j] - a) * u) : v0 + (v1 - v0) * u;
    }
  }
  return keys[keys.length - 1][1];
}
/** pose an element: c = centered on its left/top, x/y px, s scale, r rotate, o opacity, b blur */
function T(el, o = {}) {
  if (typeof el === 'string') el = $(el);
  let tr = o.c ? 'translate(-50%,-50%) ' : '';
  if (o.x || o.y) tr += `translate(${(o.x || 0).toFixed(2)}px,${(o.y || 0).toFixed(2)}px) `;
  if (o.yp) tr += `translateY(${o.yp.toFixed(2)}%) `;
  if (o.r) tr += `rotate(${o.r.toFixed(3)}deg) `;
  const s = o.s ?? 1, sx = (o.sx ?? 1) * s, sy = (o.sy ?? 1) * s;
  if (sx !== 1 || sy !== 1) tr += `scale(${sx.toFixed(4)},${sy.toFixed(4)})`;
  el.style.transform = tr || 'none';
  if (o.o !== undefined) { const v = clamp(o.o); el.style.opacity = v.toFixed(3); el.style.visibility = v <= 0.002 ? 'hidden' : 'visible'; }
  if (o.b !== undefined) el.style.filter = o.b > 0.05 ? `blur(${o.b.toFixed(2)}px)` : 'none';
}
// display (not visibility) so children posed visible by T() can't leak out of a hidden scene
const show = (el, on) => { (typeof el === 'string' ? $(el) : el).style.display = on ? '' : 'none'; };
const C = { // place colors (design-direction.md DS17), light / dark
  blue: [0, 122, 255], indigo: [88, 86, 214], teal: [48, 176, 199], green: [52, 199, 89], orange: [255, 149, 0],
  pink: [255, 45, 85], red: [255, 59, 48], grey: [142, 142, 147] };
const CD = { blue: [10, 132, 255], indigo: [94, 92, 230], teal: [64, 200, 224], green: [48, 209, 88], orange: [255, 159, 10] };
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mix = (a, b, u) => a.map((v, i) => v + (b[i] - v) * u);
const I = { house: 'e2c2', briefcase: 'e0ee', cart: 'e41e', barbell: 'e0b6', grad: 'e62c', fork: 'e262', aid: 'e56e', car: 'e112',
  plane: 'e5d6', church: 'ecea', heart: 'e2a8', pin: 'e316', search: 'e30c', back: 'e138', next: 'e13a', plus: 'e3d4', x: 'e4f6',
  gps: 'e1d6', nav: 'eade', arrive: 'e428', leave: 'e42a', clock: 'e19a', repeat: 'e3f6', mic: 'e326', bell: 'e0ce', check: 'e182',
  pause: 'e39e', note: 'e34c' };
const ic = (n, cls = 'i', extra = '') => `<span class="${cls}" style="${extra}">&#x${I[n]};</span>`;
/** offset of el inside root, ignoring transforms (for finger targets) */
function posIn(el, root) {
  let x = 0, y = 0, e = el;
  while (e && e !== root) { x += e.offsetLeft; y += e.offsetTop; e = e.offsetParent; }
  return { x, y, cx: x + el.offsetWidth / 2, cy: y + el.offsetHeight / 2, w: el.offsetWidth, h: el.offsetHeight };
}
/** split a headline into masked words: "Every place,|at a glance." — *word* gets the gradient class */
function words(text, grad = 'g1') {
  return text.split('|').map((line) => '<span class="ln">' + line.split(' ').map((w) => {
    const g = w.startsWith('*'); w = w.replace(/\*/g, '');
    return `<span class="w"><span class="wi${g ? ' ' + grad : ''}">${w}</span></span>`;
  }).join(' ') + '</span>').join('');
}

/* ================= map art ================= */
function mapSvg(x0, y0, w, h) { // light app map, same drawing as the mockups, extended for panning
  const c = { land: '#EEF0F3', block: '#E5E8EC', park: '#DCEFD8', water: '#CFE3F6', road: '#FFFFFF', major: '#FFFFFF', casing: '#D9DDE3', label: '#9AA0A8' };
  let s = `<svg width="${w}" height="${h}" viewBox="${x0} ${y0} ${w} ${h}" style="position:absolute;left:${x0}px;top:${y0}px;display:block">`
    + `<rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="${c.land}"/>`;
  const xs = [], ys = [];
  for (let x = -40 - 74 * 12; x < x0 + w; x += 74) if (x > x0 - 80) xs.push(x);
  for (let y = -40 - 62 * 12; y < y0 + h; y += 62) if (y > y0 - 70) ys.push(y);
  for (const x of xs) for (const y of ys) {
    if ((((x * 7 + y * 3) % 5) + 5) % 5 === 0) continue;
    s += `<rect x="${x + 8}" y="${y + 8}" width="58" height="46" rx="4" fill="${c.block}"/>`;
  }
  s += `<path d="M-900 560 C -700 500, -520 610, -360 570 S -120 480, -40 520 C 80 470, 140 600, 250 560 S 420 470, 620 520 S 900 600, 1200 540 L 1200 650 C 900 690, 760 600, 620 600 C 430 560, 330 650, 240 640 S 70 560, -40 610 S -300 660, -500 630 S -760 650, -900 660 Z" fill="${c.water}"/>`;
  for (const [x, y, ww, hh] of [[252, 96, 120, 98], [-20, 300, 96, 84], [-330, 40, 140, 110], [480, 330, 130, 96], [30, -220, 150, 100], [-260, 760, 160, 110], [420, 760, 140, 100], [640, -120, 120, 120]])
    s += `<rect x="${x}" y="${y}" width="${ww}" height="${hh}" rx="10" fill="${c.park}"/>`;
  for (const x of xs) s += `<rect x="${x}" y="${y0}" width="8" height="${h}" fill="${c.road}"/>`;
  for (const y of ys) s += `<rect x="${x0}" y="${y}" width="${w}" height="8" fill="${c.road}"/>`;
  const major = (d) => `<path d="${d}" stroke="${c.casing}" stroke-width="17" fill="none"/><path d="${d}" stroke="${c.major}" stroke-width="13" fill="none"/>`;
  s += major('M-900 250 C -500 228, -200 245, -40 238 C 120 226, 260 260, 640 214 S 1000 190, 1300 205');
  s += major('M168 -900 C 160 -500, 176 -200, 168 -40 C 176 200, 150 420, 196 900 S 212 1200, 200 1400');
  s += `<text x="300" y="232" font-family="Inter" font-size="10" font-weight="600" fill="${c.label}" transform="rotate(-6 300 232)">Main St</text>`
    + `<text x="160" y="140" font-family="Inter" font-size="10" font-weight="600" fill="${c.label}" transform="rotate(88 160 140)">Oak Ave</text>`;
  return s + '</svg>';
}
function worldSvg() { // dark city for scene 3: blocks 120 × 100, roads centred on multiples of 120 / 100
  const X0 = -1200, Y0 = -600, W = 4200, H = 2800; // overscan so the camera never finds an edge
  const c = { land: '#EEF0F3', a: '#E5E8EC', b: '#E3E6EA', park: '#DCEFD8', water: '#CFE3F6', road: '#FFFFFF', major: '#FFFFFF', casing: '#D9DDE3', label: '#9AA0A8' };
  let s = `<svg width="${W}" height="${H}" viewBox="${X0} ${Y0} ${W} ${H}" style="position:absolute;left:${X0}px;top:${Y0}px;display:block"><rect x="${X0}" y="${Y0}" width="${W}" height="${H}" fill="${c.land}"/>`;
  for (let x = X0; x < X0 + W; x += 120) for (let y = Y0; y < Y0 + H; y += 100) {
    const k = ((((x / 120) * 7 + (y / 100) * 13) % 11) + 11) % 11;
    const fill = k === 4 || k === 9 ? c.park : k % 2 ? c.a : c.b;
    if (k === 6 || k === 2) { // split blocks into houses
      s += `<rect x="${x + 8}" y="${y + 8}" width="48" height="84" rx="5" fill="${fill}"/><rect x="${x + 64}" y="${y + 8}" width="48" height="84" rx="5" fill="${fill}"/>`;
    } else s += `<rect x="${x + 8}" y="${y + 8}" width="104" height="84" rx="6" fill="${fill}"/>`;
  }
  s += `<path d="M-1300 1180 C -900 1100, -400 1240, -50 1130 C 300 1060, 520 1220, 900 1150 S 1500 1010, 1900 1080 S 2400 1180, 2700 1100 L 3100 1150 L 3100 1300 L 2700 1240 C 2400 1300, 2100 1200, 1900 1210 S 1300 1150, 900 1280 S 300 1200, -50 1270 C -400 1380, -900 1240, -1300 1320 Z" fill="${c.water}"/>`;
  for (let x = X0; x <= X0 + W; x += 120) s += `<rect x="${x - 4}" y="${Y0}" width="8" height="${H}" fill="${c.road}"/>`;
  for (let y = Y0; y <= Y0 + H; y += 100) s += `<rect x="${X0}" y="${y - 4}" width="${W}" height="8" fill="${c.road}"/>`;
  const major = (d) => `<path d="${d}" stroke="${c.casing}" stroke-width="24" fill="none"/><path d="${d}" stroke="${c.major}" stroke-width="16" fill="none"/>`;
  s += major('M-1300 600 L 3100 600') + major('M960 -700 L 960 2300') + major('M-1300 2100 C -400 1700, 0 1650, 300 1500 S 1500 300, 3100 -100');
  s += `<text x="690" y="588" font-family="Inter" font-size="15" font-weight="600" fill="${c.label}" letter-spacing="1">MAIN ST</text>`
    + `<text x="1700" y="588" font-family="Inter" font-size="15" font-weight="600" fill="${c.label}" letter-spacing="1">MAIN ST</text>`
    + `<text x="948" y="330" font-family="Inter" font-size="15" font-weight="600" fill="${c.label}" letter-spacing="1" transform="rotate(90 948 330)">OAK AVE</text>`;
  return s + '</svg>';
}
