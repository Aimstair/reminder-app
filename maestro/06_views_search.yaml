# FL-12: Schedule → Month → Day → Schedule via the view pill; search finds a reminder and offers
# Create for a miss.
appId: app.aimstair.reminder_app
name: FL-12 views and search
---
- runFlow: common/fresh_app.yaml
- runFlow:
    file: common/save_reminder.yaml
    env:
      TEXT: "Dentist tomorrow 3pm"
- tapOn: "Schedule"          # view pill (shows the current view) → menu
- tapOn: "Month"
- assertVisible: ".*events?.*|.*meetings?.*|.*occasions?.*"   # month summary chips (mockup 08)
- tapOn: "Month"             # pill → menu
- tapOn: "Day"
- assertVisible: ".*busy.*"  # Day header pill (mockup 06)
- tapOn: "Day"               # pill → menu
- tapOn: "Schedule"
- assertVisible: ".*Dentist.*"
- tapOn: "Search"
- inputText: "dent"
- assertVisible: ".*Dentist.*"
- eraseText: 10
- inputText: "zebra"
- assertVisible: "No matches for \"zebra\""
