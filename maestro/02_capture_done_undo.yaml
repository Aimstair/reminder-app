# FL-2 capture, then OCC-5: swipe right = Done, Undo restores it.
appId: app.aimstair.reminder_app
name: FL-2 capture, swipe Done, Undo
---
- runFlow: common/fresh_app.yaml
- runFlow:
    file: common/save_reminder.yaml
    env:
      TEXT: "Call mom tomorrow 6pm"
- assertVisible: "Tomorrow"
- assertVisible: ".*Call mom.*"
# The row under "Tomorrow", not an "Up next" card (shown when it is within 12 hours).
- swipe:
    from:
      text: ".*Call mom.*"
      below: "Tomorrow"
    direction: RIGHT
# First completion ever: "Your first one!" celebration, then the Undo snackbar (OCC-5).
- tapOn:
    text: "Continue"
    optional: true
- assertVisible: "Undo"
- assertNotVisible: ".*Call mom.*"
- tapOn: "Undo"
- assertVisible: ".*Call mom.*"
